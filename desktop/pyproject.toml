[project]
name = "holostudio"
version = "0.2.0"
description = "Holographic Studio desktop: 3D design controlled by hand gestures (MediaPipe)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
